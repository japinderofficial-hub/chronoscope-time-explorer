<!DOCTYPE html>
<html>
<head>
    <title>ChronoScope</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="top">
        <h1>🕰️ ChronoScope</h1>
        <p class="tag">Explore Time & World</p>

        <div class="controls">
            <input type="number" id="year" placeholder="Year (e.g. 2007)">
            <input type="text" id="country" placeholder="Country (e.g. India)">
            <button onclick="explore()">Explore</button>
        </div>

        <p id="quote">Loading inspiration...</p>
    </div>

    <div class="grid">
        <div class="card">
            <h2>📜 Events</h2>
            <ul id="events"></ul>
        </div>

        <div class="card">
            <h2>📰 News</h2>
            <ul id="news"></ul>
        </div>

        <div class="card">
            <h2>🎬 Movies</h2>
            <ul id="movies"></ul>
        </div>

        <div class="card">
            <h2>🌦️ Weather</h2>
            <p id="weather"></p>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
